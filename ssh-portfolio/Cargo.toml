[package]
name = "ssh-portfolio"
version = "0.1.0"
edition = "2024"
description = "Interactive SSH Ratatui portfolio server for Ali Turan (Alttre) — alttre.is-a.dev"
license = "MIT"

[dependencies]
# Use `ring` instead of default `aws-lc-rs` so Windows MSVC and Linux Docker build without cmake/nasm.
russh = { version = "0.65.2", default-features = false, features = ["flate2", "ring", "rsa"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rand = "0.10.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
